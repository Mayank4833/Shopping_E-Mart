<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Simple Shopping Cart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Mayank's E-Mart</h1>

  <div class="container">

    <div class="products-side">

      <!-- Filter and sort controls -->
      <div class="filters">
        <input type="text" id="search" placeholder="Search product" onkeyup="showProducts()">

        <select id="category" onchange="showProducts()">
          <option value="all">All Categories</option>
          <option value="Electronics">Electronics</option>
          <option value="Stationery">Stationery</option>
          <option value="Bags">Bags</option>
        </select>

        <select id="sort" onchange="showProducts()">
          <option value="none">Sort By</option>
          <option value="low">Price: Low to High</option>
          <option value="high">Price: High to Low</option>
          <option value="name">Name: A to Z</option>
        </select>
      </div>

      <div id="productList"></div>
    </div>

    <div class="cart-side">
      <h2>Cart</h2>
      <div id="cartList"></div>

      <div class="coupon">
        <input type="text" id="couponInput" placeholder="Coupon code">
        <button onclick="applyCoupon()">Apply</button>
      </div>
      <p id="couponMsg"></p>
      <small>Try: SAVE10 or FLAT100</small>

      <p>Subtotal: ₹<span id="subtotal">0</span></p>
      <p>Discount: ₹<span id="discount">0</span></p>
      <h3>Total: ₹<span id="total">0</span></h3>

      <button class="checkout-btn" onclick="openCheckout()">Checkout</button>
    </div>
  </div>

  <div id="checkoutBox" class="checkout-box">
    <h2>Checkout</h2>
    <input type="text" id="name" placeholder="Your name">
    <input type="text" id="address" placeholder="Address">
    <input type="text" id="phone" placeholder="Phone number">
    <p>Amount to pay: ₹<span id="payAmount"></span></p>
    <button onclick="placeOrder()">Place Order</button>
    <button onclick="closeCheckout()">Cancel</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
